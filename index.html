<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pro Runner V2 - Mobile Optimized</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-editor: #121212;
            --bg-nav: #1e1e1e;
            --accent: #00a8ff;
            --text: #ffffff;
            --safe-top: env(safe-area-inset-top);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg-editor); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
        }

        /* Header dengan Padding Aman (Safe Area) */
        header {
            background: var(--bg-nav);
            padding-top: calc(var(--safe-top) + 10px);
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 100;
            transition: all 0.3s ease;
        }

        /* Sembunyikan header dikit pas mode preview biar lega */
        header.compact { padding-top: 10px; padding-bottom: 5px; }

        .brand { 
            font-size: 16px; 
            font-weight: 800; 
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .brand span { color: var(--accent); }

        .controls { display: flex; align-items: center; gap: 15px; }

        /* Tombol File Modis */
        .file-label {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #2a2a2a;
            color: #aaa;
            cursor: pointer;
            border: 1px solid #444;
        }

        /* Toggle Switch bergaya Acode */
        .switcher {
            display: flex;
            background: #2a2a2a;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid #444;
        }

        .sw-btn {
            border: none;
            background: transparent;
            color: #777;
            padding: 6px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .sw-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 168, 255, 0.3);
        }

        /* Layout Utama */
        main { flex: 1; position: relative; width: 100%; background: var(--bg-editor); }

        #editor-container, #preview-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            transition: opacity 0.2s ease;
        }

        #preview-container { display: none; background: white; }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #cfcfcf;
            border: none;
            padding: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            outline: none;
            resize: none;
            line-height: 1.6;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* Spinner Loading */
        #loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-editor);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #222;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <header id="mainHeader">
        <div class="brand">PRO<span>RUNNER</span></div>
        
        <div class="controls">
            <label for="fileInput" class="file-label" title="Upload File">
                <i class="fas fa-file-upload"></i>
            </label>
            <input type="file" id="fileInput" accept=".html">

            <div class="switcher">
                <button id="btnCode" class="sw-btn active" onclick="switchTo('code')">
                    <i class="fas fa-code"></i>
                </button>
                <button id="btnRun" class="sw-btn" onclick="switchTo('run')">
                    <i class="fas fa-play"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div id="loader">
            <div class="spinner"></div>
            <p style="margin-top: 15px; font-size: 12px; color: #666;">LOADING PREVIEW...</p>
        </div>

        <div id="editor-container">
            <textarea id="codeInput" placeholder="Tempel kode gateway kamu di sini..."></textarea>
        </div>

        <div id="preview-container">
            <iframe id="outputFrame"></iframe>
        </div>
    </main>

    <script>
        const header = document.getElementById('mainHeader');
        const editorCont = document.getElementById('editor-container');
        const previewCont = document.getElementById('preview-container');
        const btnCode = document.getElementById('btnCode');
        const btnRun = document.getElementById('btnRun');
        const codeInput = document.getElementById('codeInput');
        const loader = document.getElementById('loader');
        const frame = document.getElementById('outputFrame');
        const fileInput = document.getElementById('fileInput');

        let blobUrl = null;

        function switchTo(mode) {
            if (mode === 'code') {
                // Pindah ke Editor
                previewCont.style.display = 'none';
                editorCont.style.display = 'block';
                btnRun.classList.remove('active');
                btnCode.classList.add('active');
                header.classList.remove('compact');
            } else {
                // Pindah ke Preview (Run)
                const code = codeInput.value;
                if (!code.trim()) return alert("Kodenya kosong, Boss!");

                loader.style.display = 'flex';
                
                setTimeout(() => {
                    if (blobUrl) URL.revokeObjectURL(blobUrl);
                    
                    const blob = new Blob([code], { type: 'text/html' });
                    blobUrl = URL.createObjectURL(blob);
                    frame.src = blobUrl;

                    editorCont.style.display = 'none';
                    previewCont.style.display = 'block';
                    btnCode.classList.remove('active');
                    btnRun.classList.add('active');
                    header.classList.add('compact'); // Header jadi lebih kecil biar muat banyak

                    frame.onload = () => {
                        loader.style.display = 'none';
                    };
                }, 400); // Jeda sedikit biar mata nggak kaget (anti-lag)
            }
        }

        // Handle Upload
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                codeInput.value = ev.target.result;
                switchTo('run');
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
