<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pro Runner V5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-nav: #1e1e1e;
            --bg-editor: #000000;
            --accent: #00a8ff;
            --text: #ffffff;
        }

        /* KUNCI UTAMA: Matikan scroll di body */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html { 
            height: 100%; 
            width: 100%;
            overflow: hidden; /* Biar C|R gak ikut keseret */
            background: var(--bg-editor);
            font-family: sans-serif;
        }

        /* CONTAINER FLEXBOX: Membagi Atas & Bawah */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* HEADER (C | R) - Tetap di Atas */
        header {
            height: 65px;
            background: var(--bg-nav);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border-bottom: 2px solid #333;
            flex-shrink: 0; /* Jangan biarkan header mengecil */
            z-index: 999;
        }

        .brand { color: #fff; font-weight: 800; font-size: 14px; }
        .brand span { color: var(--accent); }

        .controls { display: flex; align-items: center; gap: 10px; }

        .btn-upload {
            color: #aaa; font-size: 18px; padding: 10px;
        }

        .switcher {
            display: flex; background: #2a2a2a; padding: 4px; border-radius: 8px;
        }

        .sw-btn {
            border: none; background: transparent; color: #888;
            padding: 7px 16px; border-radius: 6px; font-weight: bold;
            font-size: 12px;
        }

        .sw-btn.active {
            background: var(--accent); color: white;
        }

        /* AREA KONTEN (MAIN) - Punya Scroll Sendiri */
        main {
            flex: 1; /* Ambil sisa layar */
            position: relative;
            overflow: hidden;
            background: var(--bg-editor);
        }

        #editor-container, #preview-container {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
        }

        /* JARAK (PADDING) AGAR KODE GAK MEPET HEADER */
        textarea {
            width: 100%; height: 100%;
            background: transparent; color: #00ff00;
            border: none; padding: 20px; /* Jarak yang kamu mau */
            font-family: monospace; font-size: 13px;
            outline: none; resize: none;
            white-space: pre; overflow: auto;
        }

        iframe { width: 100%; height: 100%; border: none; background: white; }

        #loader {
            position: fixed; top: 65px; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
        }
        
        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="brand">PRO<span>RUNNER V5</span></div>
            <div class="controls">
                <label for="fileInput" class="btn-upload"><i class="fas fa-file-code"></i></label>
                <input type="file" id="fileInput" accept=".html">
                
                <div class="switcher">
                    <button id="btnCode" class="sw-btn active" onclick="switchTo('code')">CODE</button>
                    <button id="btnRun" class="sw-btn" onclick="switchTo('run')">RUN</button>
                </div>
            </div>
        </header>

        <main>
            <div id="loader"><div style="color:var(--accent)">Loading...</div></div>

            <div id="editor-container">
                <textarea id="codeInput" 
                    spellcheck="false" wrap="off" 
                    autocorrect="off" autocapitalize="off"
                    placeholder="Tempel kode di sini..."></textarea>
            </div>

            <div id="preview-container">
                <iframe id="outputFrame"></iframe>
            </div>
        </main>
    </div>

    <script>
        const editorCont = document.getElementById('editor-container');
        const previewCont = document.getElementById('preview-container');
        const btnCode = document.getElementById('btnCode');
        const btnRun = document.getElementById('btnRun');
        const codeInput = document.getElementById('codeInput');
        const frame = document.getElementById('outputFrame');
        const loader = document.getElementById('loader');

        let blobUrl = null;

        function switchTo(mode) {
            if (mode === 'code') {
                previewCont.style.display = 'none';
                editorCont.style.display = 'block';
                btnRun.classList.remove('active');
                btnCode.classList.add('active');
            } else {
                const code = codeInput.value;
                if (!code.trim()) return;

                loader.style.display = 'flex';
                
                setTimeout(() => {
                    if (blobUrl) URL.revokeObjectURL(blobUrl);
                    const blob = new Blob([code], { type: 'text/html' });
                    blobUrl = URL.createObjectURL(blob);
                    frame.src = blobUrl;

                    editorCont.style.display = 'none';
                    previewCont.style.display = 'block';
                    btnCode.classList.remove('active');
                    btnRun.classList.add('active');

                    frame.onload = () => { loader.style.display = 'none'; };
                }, 50); 
            }
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                codeInput.value = ev.target.result;
                switchTo('run');
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
