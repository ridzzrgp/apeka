<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Code Runner - Acode Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-editor: #1e1e1e;
            --bg-nav: #252526;
            --accent: #0078d4;
            --text: #d4d4d4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-editor); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Navbar / Header */
        header {
            background: var(--bg-nav);
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #333;
            z-index: 100;
        }

        .brand { color: var(--accent); font-weight: bold; font-size: 14px; letter-spacing: 1px; }

        .toggle-container {
            display: flex;
            background: #333;
            border-radius: 6px;
            padding: 3px;
        }

        .toggle-btn {
            padding: 6px 15px;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: white;
        }

        .toggle-btn i { font-size: 14px; }

        /* Main Content */
        main { flex: 1; position: relative; width: 100%; }

        /* Editor Section */
        #editor-view {
            width: 100%;
            height: 100%;
            display: block; /* Default View */
        }

        textarea {
            width: 100%;
            height: 100%;
            background: var(--bg-editor);
            color: var(--text);
            border: none;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            outline: none;
            resize: none;
            line-height: 1.6;
        }

        /* Preview Section */
        #preview-view {
            width: 100%;
            height: 100%;
            display: none; /* Hidden by default */
            background: white;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* Loader Animation */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 200;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* File Upload Hidden */
        #fileInput { display: none; }
        .btn-upload { color: #aaa; margin-right: 15px; cursor: pointer; font-size: 18px; }
        .btn-upload:hover { color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="brand">PRO <span style="color:white">RUNNER</span></div>
        
        <div style="display: flex; align-items: center;">
            <label for="fileInput" class="btn-upload" title="Upload HTML">
                <i class="fas fa-file-import"></i>
            </label>
            <input type="file" id="fileInput" accept=".html">

            <div class="toggle-container">
                <button id="btn-code" class="toggle-btn active" onclick="showEditor()">
                    <i class="fas fa-code"></i>
                </button>
                <button id="btn-run" class="toggle-btn" onclick="showPreview()">
                    <i class="fas fa-play"></i>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div id="loader">
            <div class="spinner"></div>
        </div>

        <div id="editor-view">
            <textarea id="codeInput" placeholder="Masukkan kode HTML/CSS/JS di sini..."></textarea>
        </div>

        <div id="preview-view">
            <iframe id="outputFrame"></iframe>
        </div>
    </main>

    <script>
        const editorView = document.getElementById('editor-view');
        const previewView = document.getElementById('preview-view');
        const btnCode = document.getElementById('btn-code');
        const btnRun = document.getElementById('btn-run');
        const codeInput = document.getElementById('codeInput');
        const loader = document.getElementById('loader');
        const frame = document.getElementById('outputFrame');
        const fileInput = document.getElementById('fileInput');

        let currentBlobUrl = null;

        // Fungsi Tampilkan Editor
        function showEditor() {
            previewView.style.display = 'none';
            editorView.style.display = 'block';
            btnRun.classList.remove('active');
            btnCode.classList.add('active');
        }

        // Fungsi Tampilkan Preview (Anti Lag)
        function showPreview() {
            const code = codeInput.value;
            
            // Aktifkan tombol & Tampilkan Loader
            btnCode.classList.remove('active');
            btnRun.classList.add('active');
            loader.style.display = 'flex';

            // Jeda sebentar agar UI tidak freeze saat proses render
            setTimeout(() => {
                if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);

                const blob = new Blob([code], { type: 'text/html' });
                currentBlobUrl = URL.createObjectURL(blob);
                
                frame.src = currentBlobUrl;

                // Tampilkan frame hasil
                editorView.style.display = 'none';
                previewView.style.display = 'block';

                frame.onload = () => {
                    loader.style.display = 'none';
                };
            }, 300);
        }

        // Handle File Upload
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                codeInput.value = event.target.result;
                showPreview(); // Langsung lihat hasil setelah upload
            };
            reader.readAsText(file);
        });

        // Shortcut Ctrl+S atau Ctrl+Enter untuk Run
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && (e.key === 'Enter' || e.key === 's')) {
                e.preventDefault();
                showPreview();
            }
        });
    </script>
</body>
</html>
