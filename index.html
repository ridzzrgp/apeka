<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Runner - Anti Lag & File Support</title>
    <style>
        :root { --primary: #0070f3; --bg: #0f0f0f; --card: #1a1a1a; --text: #efefef; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Header & Toolbar */
        header { padding: 10px 20px; background: var(--card); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .btn-group { display: flex; gap: 8px; align-items: center; }
        
        /* Layout */
        main { display: flex; flex: 1; position: relative; }
        .editor-container { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .preview-container { flex: 1; background: white; position: relative; }
        
        textarea {
            flex: 1; background: transparent; color: #aaa; border: none; padding: 20px;
            font-family: 'Fira Code', monospace; font-size: 13px; resize: none; outline: none; line-height: 1.5;
        }

        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* Buttons & Inputs */
        button {
            padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer;
            font-weight: 500; transition: 0.2s; font-size: 13px;
        }
        .btn-run { background: var(--primary); color: white; }
        .btn-file { background: #333; color: white; position: relative; overflow: hidden; }
        .btn-file input { position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Animasi Loading */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid var(--primary);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { margin-top: 15px; font-size: 14px; color: var(--primary); letter-spacing: 1px; }

        .label-tag { background: #333; padding: 2px 8px; border-radius: 4px; font-size: 10px; margin-bottom: 5px; display: inline-block; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 700; font-size: 18px;">⚡ <span style="color:var(--primary)">Vercel</span>Runner</div>
        <div class="btn-group">
            <button class="btn-file">
                📁 Upload HTML
                <input type="file" id="fileInput" accept=".html">
            </button>
            <button class="btn-run" onclick="triggerRun()">Run Project 🚀</button>
        </div>
    </header>

    <main>
        <div id="loader">
            <div class="spinner"></div>
            <div class="loading-text">SEDANG MENYIAPKAN TAMPILAN...</div>
        </div>

        <div class="editor-container">
            <div style="padding: 10px 20px; font-size: 11px; color: #666;">EDITOR (PASTE DISINI)</div>
            <textarea id="codeInput" placeholder=""></textarea>
        </div>

        <div class="preview-container">
            <iframe id="outputFrame"></iframe>
        </div>
    </main>

    <script>
        const codeInput = document.getElementById('codeInput');
        const fileInput = document.getElementById('fileInput');
        const loader = document.getElementById('loader');
        const frame = document.getElementById('outputFrame');
        let currentBlobUrl = null;

        // 1. Fitur Upload File (Anti Lag saat input besar)
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                codeInput.value = event.target.result;
                triggerRun(); // Langsung jalankan setelah upload
            };
            reader.readAsText(file);
        });

        // 2. Fungsi Trigger dengan Animasi (Anti Lag saat Render)
        function triggerRun() {
            const code = codeInput.value;
            if (!code.trim()) return;

            // Tampilkan animasi loading
            loader.style.display = 'flex';

            // Gunakan setTimeout agar browser sempat merender animasi 'Loader' 
            // sebelum melakukan proses berat di background
            setTimeout(() => {
                executeRendering(code);
            }, 300); 
        }

        function executeRendering(code) {
            try {
                if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);

                const blob = new Blob([code], { type: 'text/html' });
                currentBlobUrl = URL.createObjectURL(blob);
                
                frame.src = currentBlobUrl;

                // Sembunyikan loader setelah iframe mulai memuat
                frame.onload = () => {
                    loader.style.display = 'none';
                };
            } catch (err) {
                alert("Gagal memproses kode: " + err);
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
