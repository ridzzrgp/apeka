<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pro Runner V4</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-nav: #1e1e1e;
            --bg-body: #121212;
            --accent: #00a8ff;
            --header-height: 60px;
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-body); 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; /* Mengunci layar utama agar navigasi tidak ikut geser */
            display: flex;
            flex-direction: column;
        }

        /* HEADER TETAP DI ATAS - TIDAK AKAN PERNAH HILANG */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: calc(var(--header-height) + var(--safe-top));
            padding-top: var(--safe-top);
            background: var(--bg-nav);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 15px;
            padding-right: 15px;
            border-bottom: 1px solid #333;
            z-index: 9999; /* Z-Index Dewa agar tidak tertutup konten HTML apapun */
        }

        .brand { font-size: 14px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
        .brand span { color: var(--accent); }

        .top-controls { display: flex; align-items: center; gap: 10px; }

        .icon-btn {
            background: #2a2a2a; border: 1px solid #444; color: #aaa;
            width: 38px; height: 38px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }

        .switcher { 
            display: flex; background: #2a2a2a; padding: 3px; 
            border-radius: 8px; border: 1px solid #444; 
        }

        .sw-btn {
            border: none; background: transparent; color: #777; 
            padding: 6px 15px; border-radius: 6px; font-size: 13px;
            font-weight: bold; transition: 0.2s;
        }

        .sw-btn.active { background: var(--accent); color: white; }

        /* AREA KONTEN MULAI DI BAWAH HEADER */
        main {
            flex: 1;
            margin-top: calc(var(--header-height) + var(--safe-top));
            position: relative;
            background: var(--bg-body);
            overflow: hidden;
        }

        #editor-container, #preview-container {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
        }

        #preview-container { display: none; background: white; }

        /* OPTIMASI TEXTAREA UNTUK 10.000+ BARIS */
        textarea {
            width: 100%; height: 100%;
            background: #000; color: #cfcfcf;
            border: none; padding: 15px;
            font-family: 'Fira Code', monospace; font-size: 12px;
            outline: none; resize: none;
            white-space: pre; overflow: auto;
            word-wrap: normal;
            /* Tambahan agar paste lancar */
            -webkit-overflow-scrolling: touch;
        }

        iframe { width: 100%; height: 100%; border: none; }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18,18,18,0.9); display: none; 
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000;
        }

        .spinner {
            width: 30px; height: 30px; border: 3px solid #333;
            border-top: 3px solid var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="brand">PRO<span>RUNNER V4</span></div>
        <div class="top-controls">
            <label for="fileInput" class="icon-btn"><i class="fas fa-file-import"></i></label>
            <input type="file" id="fileInput" accept=".html">
            
            <div class="switcher">
                <button id="btnCode" class="sw-btn active" onclick="switchTo('code')"><i class="fas fa-code"></i></button>
                <button id="btnRun" class="sw-btn" onclick="switchTo('run')"><i class="fas fa-play"></i></button>
            </div>
        </div>
    </header>

    <main>
        <div id="loader">
            <div class="spinner"></div>
            <p style="color:#666; font-size:10px; margin-top:10px;">RENDERING...</p>
        </div>

        <div id="editor-container">
            <textarea id="codeInput" 
                spellcheck="false" wrap="off" 
                autocorrect="off" autocapitalize="off"
                placeholder="Paste code di sini..."></textarea>
        </div>

        <div id="preview-container">
            <iframe id="outputFrame"></iframe>
        </div>
    </main>

    <script>
        const editorCont = document.getElementById('editor-container');
        const previewCont = document.getElementById('preview-container');
        const btnCode = document.getElementById('btnCode');
        const btnRun = document.getElementById('btnRun');
        const codeInput = document.getElementById('codeInput');
        const frame = document.getElementById('outputFrame');
        const loader = document.getElementById('loader');

        let blobUrl = null;

        function switchTo(mode) {
            if (mode === 'code') {
                previewCont.style.display = 'none';
                editorCont.style.display = 'block';
                btnRun.classList.remove('active');
                btnCode.classList.add('active');
            } else {
                const code = codeInput.value;
                if (!code.trim()) return;

                loader.style.display = 'flex';
                
                // Gunakan Blob agar 10k baris tidak membebani memori Iframe
                setTimeout(() => {
                    try {
                        if (blobUrl) URL.revokeObjectURL(blobUrl);
                        const blob = new Blob([code], { type: 'text/html' });
                        blobUrl = URL.createObjectURL(blob);
                        frame.src = blobUrl;

                        editorCont.style.display = 'none';
                        previewCont.style.display = 'block';
                        btnCode.classList.remove('active');
                        btnRun.classList.add('active');

                        frame.onload = () => { loader.style.display = 'none'; };
                    } catch (e) {
                        alert("Error: " + e.message);
                        loader.style.display = 'none';
                    }
                }, 50); 
            }
        }

        // Handle File Upload secara langsung (Solusi paling stabil untuk file raksasa)
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                codeInput.value = ev.target.result;
                switchTo('run');
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
