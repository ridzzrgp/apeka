<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pro Runner</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#0f1115;
}

/* HEADER TETAP */
#header{
position:fixed;
top:0;
left:0;
right:0;
height:55px;
background:#181b22;
border-bottom:1px solid #333;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
z-index:99999;
}

#title{
color:white;
font-weight:bold;
font-size:16px;
}

#menu{
display:flex;
gap:6px;
}

.btn{
width:40px;
height:35px;
border:none;
border-radius:8px;
background:#252a35;
color:white;
font-weight:bold;
cursor:pointer;
}

/* AREA KONTEN */
#content{
position:fixed;
top:55px;
left:0;
right:0;
bottom:0;
}

/* EDITOR */
#editor{
width:100%;
height:100%;
background:#111;
color:#fff;
border:none;
outline:none;
resize:none;
padding:12px;
font-family:monospace;
font-size:14px;
}

/* PREVIEW */
#preview{
width:100%;
height:100%;
border:none;
display:none;
background:white;
}

</style>
</head>

<body>

<div id="header">

<div id="title">
PRO RUNNER
</div>

<div id="menu">

<label for="fileInput">
<button class="btn" type="button">U</button>
</label>

<button class="btn" onclick="showCode()">
C
</button>

<button class="btn" onclick="runCode()">
R
</button>

</div>

</div>

<input
id="fileInput"
type="file"
accept=".html"
style="display:none"
>

<div id="content">

<textarea id="editor"
placeholder="Tempel kode HTML di sini..."></textarea>

<iframe id="preview"></iframe>

</div>

<script>

const editor =
document.getElementById("editor");

const preview =
document.getElementById("preview");

function showCode(){

editor.style.display="block";
preview.style.display="none";

}

function runCode(){

let code=editor.value.trim();

if(code===""){
alert("Masukkan kode dulu");
return;
}

editor.style.display="none";
preview.style.display="block";

/* PALING AMAN UNTUK WEBVIEW */
preview.srcdoc=code;

}

document
.getElementById("fileInput")
.addEventListener("change",function(e){

let file=e.target.files[0];

if(!file)return;

let reader=new FileReader();

reader.onload=function(ev){

editor.value=ev.target.result;

};

reader.readAsText(file);

});

</script>

</body>
</html>
