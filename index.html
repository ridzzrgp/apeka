<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1115">
  <title>Pro Runner</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="/manifest.json">

  <!-- CodeMirror 5: editor dengan syntax highlighting HTML -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0f1115;
    }

    #header {
      position: fixed;
      top: 25px;
      left: 0;
      right: 0;
      height: 55px;
      background: #181b22;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px;
      z-index: 99999;
    }

    #title {
      color: white;
      font-weight: bold;
      font-size: 15px;
      white-space: nowrap;
    }

    #menu {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn,
    .tool-btn {
      width: 36px;
      height: 35px;
      flex: 0 0 36px;
      border: none;
      border-radius: 8px;
      background: #252a35;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:active,
    .tool-btn:active {
      background: #354052;
    }

    #content {
      position: fixed;
      top: 80px;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      overflow: hidden;
    }

    #editorPane {
      min-width: 0;
      min-height: 0;
      background: #111;
    }

    #editor {
      display: block;
      width: 100%;
      height: 100%;
      padding: 12px;
      resize: none;
      outline: none;
      border: none;
      background: #111;
      color: #fff;
      font: 14px/1.5 monospace;
      tab-size: 2;
    }

    .CodeMirror {
      width: 100%;
      height: 100%;
      font: 14px/1.5 monospace;
    }

    .CodeMirror-gutters {
      border-right: 1px solid #30343d;
    }

    #preview {
      display: none;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    /* Mode editor: hanya editor yang terlihat */
    #content.mode-editor #editorPane {
      display: block;
      width: 100%;
      height: 100%;
    }

    #content.mode-editor #preview {
      display: none;
    }

    /* Mode preview: hanya hasil website yang terlihat */
    #content.mode-preview #editorPane {
      display: none;
    }

    #content.mode-preview #preview {
      display: block;
    }

    /* Mode live: editor dan hasil website tampil bersamaan */
    #content.mode-live {
      flex-direction: column;
    }

    #content.mode-live #editorPane {
      display: block;
      width: 100%;
      height: 50%;
      flex: 0 0 50%;
      border-bottom: 1px solid #3a3f49;
    }

    #content.mode-live #preview {
      display: block;
      width: 100%;
      height: 50%;
      flex: 0 0 50%;
    }

    @media (min-width: 900px) {
      #content.mode-live {
        flex-direction: row;
      }

      #content.mode-live #editorPane {
        width: 50%;
        height: 100%;
        flex: 0 0 50%;
        border-bottom: none;
        border-right: 1px solid #3a3f49;
      }

      #content.mode-live #preview {
        width: 50%;
        height: 100%;
        flex: 0 0 50%;
      }
    }

    @media (max-width: 380px) {
      #header {
        padding: 0 6px;
        gap: 4px;
      }

      #title {
        font-size: 13px;
      }

      #menu {
        gap: 3px;
      }

      .btn,
      .tool-btn {
        width: 33px;
        flex-basis: 33px;
      }
    }
  </style>
</head>

<body>
  <header id="header">
    <div id="title">PRO RUNNER</div>

    <nav id="menu" aria-label="Editor tools">
      <button class="btn" type="button" onclick="openFile()" title="Buka file HTML" aria-label="Buka file HTML">
        <i class="fa-solid fa-upload"></i>
      </button>

      <button class="tool-btn" type="button" onclick="showCode()" title="Editor" aria-label="Editor">
        <i class="fa-solid fa-code"></i>
      </button>

      <button class="tool-btn" type="button" onclick="runCode()" title="Preview" aria-label="Preview">
        <i class="fa-solid fa-eye"></i>
      </button>

      <button class="tool-btn" type="button" onclick="showLive()" title="Live Preview" aria-label="Live Preview">
        <i class="fa-solid fa-bolt"></i>
      </button>

      <button class="tool-btn" type="button" onclick="openBrowserPreview()" title="Buka di browser" aria-label="Buka di browser">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </button>
    </nav>
  </header>

  <input id="fileInput" type="file" accept=".html,.htm,text/html" hidden>

  <main id="content" class="mode-editor">
    <section id="editorPane" aria-label="Code editor">
      <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Tulis kode HTML di sini..."></textarea>
    </section>
    <iframe id="preview" title="Website preview"></iframe>
  </main>

  <!-- CodeMirror core and HTML-related modes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

  <script>
    const textarea = document.getElementById("editor");
    const content = document.getElementById("content");
    const preview = document.getElementById("preview");
    const fileInput = document.getElementById("fileInput");

    let codeEditor = null;
    let previewTimer = null;
    let browserPreviewUrl = null;

    // Pakai CodeMirror bila CDN berhasil dimuat. Jika gagal, textarea tetap bisa dipakai.
    if (window.CodeMirror) {
      codeEditor = CodeMirror.fromTextArea(textarea, {
        mode: "htmlmixed",
        theme: "material-darker",
        lineNumbers: true,
        lineWrapping: true,
        indentUnit: 2,
        tabSize: 2,
        indentWithTabs: false,
        autoCloseTags: true,
        matchBrackets: true,
        viewportMargin: 30
      });

      codeEditor.on("change", function () {
        if (content.classList.contains("mode-live")) {
          schedulePreviewUpdate();
        }
      });
    }

    // Fallback: jika CodeMirror tidak termuat, live preview tetap berjalan dari textarea.
    textarea.addEventListener("input", function () {
      if (!codeEditor && content.classList.contains("mode-live")) {
        schedulePreviewUpdate();
      }
    });

    function getCode() {
      return codeEditor ? codeEditor.getValue() : textarea.value;
    }

    function setCode(value) {
      if (codeEditor) {
        codeEditor.setValue(value);
      } else {
        textarea.value = value;
      }

      if (content.classList.contains("mode-live")) {
        renderPreview();
      }
    }

    function setMode(mode) {
      content.classList.remove("mode-editor", "mode-preview", "mode-live");
      content.classList.add("mode-" + mode);

      if (codeEditor) {
        requestAnimationFrame(function () {
          codeEditor.refresh();
        });
      }
    }

    function showCode() {
      setMode("editor");
    }

    function runCode() {
      if (!getCode().trim()) {
        alert("Masukkan kode HTML dulu.");
        return;
      }

      setMode("preview");
      renderPreview();
    }

    function showLive() {
      if (!getCode().trim()) {
        alert("Masukkan kode HTML dulu.");
        return;
      }

      setMode("live");
      renderPreview();
    }

    function schedulePreviewUpdate() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(renderPreview, 250);
    }

    // Menambahkan target tab baru dan penanganan link eksternal pada halaman preview.
    function preparePreviewHTML(source) {
      let html = source;
      const baseTag = '<base target="_blank">';

      if (/<head\b[^>]*>/i.test(html)) {
        if (!/<base\b/i.test(html)) {
          html = html.replace(/<head\b[^>]*>/i, function (headTag) {
            return headTag + baseTag;
          });
        }
      } else if (/<html\b[^>]*>/i.test(html)) {
        html = html.replace(/<html\b[^>]*>/i, function (htmlTag) {
          return htmlTag + '<head>' + baseTag + '</head>';
        });
      } else {
        html = '<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">' + baseTag + '</head><body>' + html + '</body></html>';
      }

      const linkSupportScript = `
        <script>
          document.addEventListener('click', function (event) {
            const anchor = event.target.closest && event.target.closest('a[href]');
            if (!anchor || anchor.hasAttribute('download')) return;

            const rawHref = anchor.getAttribute('href');
            if (!rawHref || rawHref.startsWith('#') || /^(javascript:|data:)/i.test(rawHref)) return;

            let destination;
            try { destination = new URL(rawHref, document.baseURI); }
            catch (error) { return; }

            if (!['http:', 'https:', 'mailto:', 'tel:'].includes(destination.protocol)) return;

            event.preventDefault();
            window.open(destination.href, '_blank', 'noopener,noreferrer');
          }, true);
        <\/script>
      `;

      if (/<\/body\s*>/i.test(html)) {
        html = html.replace(/<\/body\s*>/i, linkSupportScript + '</body>');
      } else {
        html += linkSupportScript;
      }

      return html;
    }

    function renderPreview() {
      const code = getCode();
      preview.srcdoc = preparePreviewHTML(code);
    }

    // Membuka hasil sebagai dokumen HTML di tab browser baru.
    function openBrowserPreview() {
      const code = getCode();
      if (!code.trim()) {
        alert("Masukkan kode HTML dulu.");
        return;
      }

      const html = preparePreviewHTML(code);
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const newUrl = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = newUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      link.remove();

      if (browserPreviewUrl) {
        setTimeout(function () {
          URL.revokeObjectURL(browserPreviewUrl);
        }, 60000);
      }
      browserPreviewUrl = newUrl;

      setTimeout(function () {
        if (browserPreviewUrl === newUrl) {
          URL.revokeObjectURL(newUrl);
          browserPreviewUrl = null;
        }
      }, 10 * 60 * 1000);
    }

    function openFile() {
      fileInput.click();
    }

    fileInput.addEventListener("change", function (event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (loadEvent) {
        setCode(String(loadEvent.target.result || ""));
        showCode();
      };
      reader.onerror = function () {
        alert("File gagal dibaca. Coba pilih file HTML lain.");
      };
      reader.readAsText(file);
      fileInput.value = "";
    });
  </script>
</body>
</html>
