<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pro Runner V6</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-ui: #1a1a1a;
            --bg-editor: #0d0d0d;
            --accent: #00a8ff;
            --ui-height: 70px; /* Tinggi kotak navigasi */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg-editor); 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; /* Mengunci layar utama agar tidak bisa diseret */
            font-family: 'Inter', sans-serif;
        }

        /* KOTAK NAVIGASI YANG DI-LOCK (FIXED) */
        .floating-nav {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: var(--ui-height);
            background: var(--bg-ui);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 2px solid #333;
            z-index: 10000; /* Paling depan */
        }

        .brand { font-size: 14px; font-weight: 900; color: #fff; }
        .brand span { color: var(--accent); }

        .controls { display: flex; align-items: center; gap: 12px; }

        /* Tombol Upload */
        .btn-action {
            color: #888; font-size: 18px; cursor: pointer;
        }

        /* Switcher Ikon (C | R) */
        .switcher {
            display: flex; background: #2a2a2a; padding: 4px; border-radius: 10px; border: 1px solid #444;
        }

        .sw-btn {
            border: none; background: transparent; color: #666;
            width: 40px; height: 32px; border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: 0.2s;
        }

        .sw-btn.active {
            background: var(--accent); color: white;
        }

        /* AREA KERJA */
        main {
            height: 100vh;
            width: 100%;
            padding-top: var(--ui-height); /* KASIH JARAK SUPAYA KODE GAK KE ATAS BANGET */
            background: var(--bg-editor);
        }

        #editor-container, #preview-container {
            width: 100%; height: 100%;
        }

        #preview-container { display: none; background: white; }

        /* TEXTAREA UNLIMITED */
        textarea {
            width: 100%; height: 100%;
            background: transparent; color: #cfcfcf;
            border: none; padding: 20px; /* Jarak teks dari pinggir */
            font-family: 'monospace'; font-size: 13px;
            outline: none; resize: none;
            white-space: pre; overflow: auto;
        }

        iframe { width: 100%; height: 100%; border: none; }

        #loader {
            position: fixed; top: var(--ui-height); left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none;
            align-items: center; justify-content: center; z-index: 9999;
        }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="floating-nav">
        <div class="brand">PRO<span>RUNNER</span></div>
        <div class="controls">
            <label for="fileInput" class="btn-action"><i class="fas fa-file-upload"></i></label>
            <input type="file" id="fileInput" accept=".html">
            
            <div class="switcher">
                <button id="btnCode" class="sw-btn active" onclick="switchTo('code')">
                    <i class="fas fa-code"></i>
                </button>
                <button id="btnRun" class="sw-btn" onclick="switchTo('run')">
                    <i class="fas fa-play"></i>
                </button>
            </div>
        </div>
    </div>

    <main>
        <div id="loader"><div style="color:var(--accent); font-weight:bold;">PROCESSING...</div></div>

        <div id="editor-container">
            <textarea id="codeInput" 
                spellcheck="false" wrap="off" 
                autocorrect="off" autocapitalize="off"
                placeholder="Tempel kode di sini..."></textarea>
        </div>

        <div id="preview-container">
            <iframe id="outputFrame"></iframe>
        </div>
    </main>

    <script>
        const editorCont = document.getElementById('editor-container');
        const previewCont = document.getElementById('preview-container');
        const btnCode = document.getElementById('btnCode');
        const btnRun = document.getElementById('btnRun');
        const codeInput = document.getElementById('codeInput');
        const frame = document.getElementById('outputFrame');
        const loader = document.getElementById('loader');

        let blobUrl = null;

        function switchTo(mode) {
            if (mode === 'code') {
                previewCont.style.display = 'none';
                editorCont.style.display = 'block';
                btnRun.classList.remove('active');
                btnCode.classList.add('active');
            } else {
                const code = codeInput.value;
                if (!code.trim()) return;
                loader.style.display = 'flex';
                
                setTimeout(() => {
                    if (blobUrl) URL.revokeObjectURL(blobUrl);
                    const blob = new Blob([code], { type: 'text/html' });
                    blobUrl = URL.createObjectURL(blob);
                    frame.src = blobUrl;
                    editorCont.style.display = 'none';
                    previewCont.style.display = 'block';
                    btnCode.classList.remove('active');
                    btnRun.classList.add('active');
                    frame.onload = () => { loader.style.display = 'none'; };
                }, 50); 
            }
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                codeInput.value = ev.target.result;
                switchTo('run');
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
